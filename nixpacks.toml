[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.pdo", "php83Extensions.pdo_sqlite", "php83Extensions.sqlite3", "php83Extensions.mbstring", "php83Extensions.openssl", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.fileinfo", "php83Extensions.bcmath", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "mkdir -p /app/database && touch /app/database/database.sqlite && php artisan migrate --force && php artisan seed:production && php artisan serve --host=0.0.0.0 --port=$PORT"
